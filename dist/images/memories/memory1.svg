<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="50%" stopColor="#fb7185" />
      <stop offset="100%" stopColor="#fed7aa" />
    </linearGradient>
    <radialGradient id="sun1" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stopColor="#fffbeb" stopOpacity="0.9" />
      <stop offset="40%" stopColor="#fef08a" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#fb7185" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4c0519" />
      <stop offset="100%" stopColor="#1f1124" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky1)" />
  <circle cx="400" cy="360" r="180" fill="url(#sun1)" />
  <!-- Birds in distance -->
  <path d="M 240 180 Q 250 170 260 180 Q 270 170 280 180" stroke="#881337" stroke-width="2.5" fill="none" opacity="0.6" />
  <path d="M 520 140 Q 530 132 540 140 Q 550 132 560 140" stroke="#881337" stroke-width="2.5" fill="none" opacity="0.6" />
  <!-- Ground Hill -->
  <path d="M 0 520 Q 400 440 800 520 L 800 600 L 0 600 Z" fill="url(#silhouette)" />
  <!-- Couple Silhouette holding hands -->
  <g fill="url(#silhouette)">
    <!-- Person 1 -->
    <circle cx="360" cy="380" r="28" />
    <path d="M 335 415 C 335 408, 385 408, 385 415 L 390 495 L 330 495 Z" />
    <!-- Person 2 -->
    <circle cx="440" cy="390" r="26" />
    <path d="M 418 420 C 418 412, 462 412, 462 420 L 468 495 L 412 495 Z" />
    <!-- Joined Hands with heart spark -->
    <path d="M 380 435 Q 400 455 420 438" stroke="url(#silhouette)" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>
  <!-- Heart floating above hands -->
  <path d="M 400 422 C 400 415, 388 405, 388 395 C 388 382, 400 382, 400 392 C 400 382, 412 382, 412 395 C 412 405, 400 415, 400 422 Z" fill="#fb7185" />
  <text x="400" y="565" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" fill="#fce7f3" letter-spacing="2">WHERE OUR STORY BEGAN ✨</text>
</svg>
