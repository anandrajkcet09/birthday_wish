<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="50%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#fda4af" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fff" stopOpacity="0.8" />
      <stop offset="60%" stopColor="#f472b6" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#c084fc" stopOpacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky2)" />
  <circle cx="400" cy="280" r="220" fill="url(#glow2)" />
  <!-- Big Heart Silhouette Centerpiece -->
  <path d="M 400 370 C 260 250, 200 160, 280 90 C 350 30, 400 110, 400 110 C 400 110, 450 30, 520 90 C 600 160, 540 250, 400 370 Z" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
  <!-- Sparkles -->
  <circle cx="280" cy="180" r="4" fill="#fef08a" />
  <circle cx="520" cy="190" r="5" fill="#fef08a" />
  <circle cx="400" cy="160" r="6" fill="#fff" />
  <circle cx="340" cy="290" r="3" fill="#fef08a" />
  <circle cx="470" cy="280" r="4" fill="#fef08a" />
  <!-- Cute Portrait Profile Accents -->
  <path d="M 330 360 C 340 310, 390 280, 410 320" stroke="#881337" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 470 360 C 460 310, 410 280, 390 320" stroke="#881337" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  <!-- Smiling emoticon symbol -->
  <text x="400" y="270" text-anchor="middle" font-size="70">😊</text>
  <text x="400" y="470" text-anchor="middle" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="1">THAT SPECIAL SMILE</text>
  <text x="400" y="510" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="24" fill="#fef2f2">"Your smile turns my entire world golden"</text>
