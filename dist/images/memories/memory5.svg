<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="60%" stopColor="#581c87" />
      <stop offset="100%" stopColor="#be185d" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nightGlow)" />
  <!-- Crescent Moon -->
  <circle cx="640" cy="140" r="60" fill="#fef08a" />
  <circle cx="660" cy="130" r="55" fill="#1e1b4b" />
  <!-- Stars -->
  <circle cx="120" cy="100" r="3" fill="#fff" />
  <circle cx="260" cy="80" r="2.5" fill="#fff" />
  <circle cx="380" cy="120" r="4" fill="#fef08a" />
  <circle cx="500" cy="70" r="3" fill="#fff" />
  <circle cx="200" cy="200" r="3" fill="#fff" />
  <!-- Gentle Couple Embrace Silhouette -->
  <g fill="#0f172a">
    <!-- Hill -->
    <path d="M 0 510 Q 400 450 800 510 L 800 600 L 0 600 Z" />
    <!-- Couple close together -->
    <circle cx="385" cy="380" r="26" />
    <circle cx="415" cy="385" r="24" />
    <path d="M 355 410 C 355 405, 445 405, 445 410 L 450 500 L 350 500 Z" />
  </g>
  <!-- Floating Hearts Constellation -->
  <path d="M 400 330 C 400 320, 385 305, 385 290 C 385 272, 400 272, 400 285 C 400 272, 415 272, 415 290 C 415 305, 400 320, 400 330 Z" fill="#f43f5e" opacity="0.9" />
  <text x="400" y="555" text-anchor="middle" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#fdf2f8" letter-spacing="2">MY FAVOURITE PERSON</text>
</svg>
