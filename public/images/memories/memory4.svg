<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7" />
      <stop offset="50%" stopColor="#fed7aa" />
      <stop offset="100%" stopColor="#f472b6" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#coffeeBg)" />
  <!-- Cozy Coffee table scene -->
  <circle cx="400" cy="300" r="190" fill="#fff" opacity="0.6" />
  <!-- Two Coffee Cups with Latte Art Heart -->
  <g transform="translate(310, 240)">
    <rect x="0" y="0" width="80" height="90" rx="16" fill="#f43f5e" />
    <path d="M 80 25 C 105 25, 105 65, 80 65" stroke="#f43f5e" stroke-width="10" fill="none" />
    <ellipse cx="40" cy="18" rx="36" ry="14" fill="#78350f" />
    <path d="M 40 22 C 34 16, 26 12, 26 8 C 26 3, 34 3, 40 8 C 46 3, 54 3, 54 8 C 54 12, 46 16, 40 22 Z" fill="#fff" />
  </g>
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="80" height="90" rx="16" fill="#c084fc" />
    <path d="M 0 25 C -25 25, -25 65, 0 65" stroke="#c084fc" stroke-width="10" fill="none" />
    <ellipse cx="40" cy="18" rx="36" ry="14" fill="#78350f" />
    <path d="M 40 22 C 34 16, 26 12, 26 8 C 26 3, 34 3, 40 8 C 46 3, 54 3, 54 8 C 54 12, 46 16, 40 22 Z" fill="#fff" />
  </g>
  <!-- Steam rising -->
  <path d="M 350 220 Q 340 180 350 150" stroke="#fda4af" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 460 220 Q 470 180 460 150" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <text x="400" y="460" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#881337" letter-spacing="1">LITTLE THINGS, BIG MEMORIES</text>
  <text x="400" y="500" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="22" fill="#9d174d">"Coffee dates and talking about everything"</text>
</svg>
