<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fairylights" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#312e81" />
      <stop offset="50%" stopColor="#831843" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fairylights)" />
  <!-- Hanging fairy light strings -->
  <path d="M 0 60 Q 200 130 400 80 T 800 100" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 0 140 Q 300 210 600 150 T 800 170" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.5" />
  <!-- Glowing bulb orbs -->
  <circle cx="80" cy="85" r="8" fill="#fef08a" filter="drop-shadow(0 0 8px #fde047)" />
  <circle cx="210" cy="120" r="10" fill="#fef08a" filter="drop-shadow(0 0 10px #fde047)" />
  <circle cx="340" cy="95" r="9" fill="#fef08a" filter="drop-shadow(0 0 8px #fde047)" />
  <circle cx="480" cy="85" r="11" fill="#fef08a" filter="drop-shadow(0 0 10px #fde047)" />
  <circle cx="620" cy="125" r="8" fill="#fef08a" filter="drop-shadow(0 0 8px #fde047)" />
  <circle cx="740" cy="115" r="10" fill="#fef08a" filter="drop-shadow(0 0 10px #fde047)" />
  <!-- Firefly sparkles -->
  <circle cx="250" cy="280" r="5" fill="#fbcfe8" opacity="0.8" />
  <circle cx="550" cy="260" r="6" fill="#fbcfe8" opacity="0.8" />
  <circle cx="400" cy="330" r="4" fill="#fef08a" opacity="0.9" />
  <!-- Big glowing heart frame -->
  <path d="M 400 400 C 290 290, 240 210, 310 150 C 370 100, 400 160, 400 160 C 400 160, 430 100, 490 150 C 560 210, 510 290, 400 400 Z" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-dasharray="8 6" opacity="0.75" />
  <text x="400" y="475" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="2">FOREVER WORTH REMEMBERING</text>
  <text x="400" y="515" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="22" fill="#fed7aa">"Alex & Sophia • Infinite Love"</text>
</svg>
